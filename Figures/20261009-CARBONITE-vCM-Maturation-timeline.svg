<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="560" viewBox="0 0 680 280" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="280" fill="#FFFFFF"/>

  <!-- Media bars (above axis) -->
  <text x="225" y="52" text-anchor="end" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">Plate 1</text>
  <rect x="235" y="30" width="192" height="44" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="331" y="43" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#3C3489">1 week maintenance</text>
  <text x="331" y="61" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#3C3489">or maturation media</text>

  <text x="225" y="104" text-anchor="end" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">Plate 2</text>
  <rect x="235" y="82" width="385" height="44" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="427" y="95" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#3C3489">2 weeks maintenance</text>
  <text x="427" y="113" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#3C3489">or maturation media</text>

  <!-- Axis with break between D0 and D18 -->
  <g stroke="#444441" stroke-width="1">
    <line x1="40" y1="144" x2="86" y2="144"/>
    <line x1="100" y1="144" x2="620" y2="144"/>
    <line x1="82" y1="150" x2="88" y2="138"/>
    <line x1="96" y1="150" x2="102" y2="138"/>
    <line x1="40" y1="138" x2="40" y2="150"/>
    <line x1="150" y1="138" x2="150" y2="150"/>
    <line x1="235" y1="138" x2="235" y2="150"/>
    <line x1="427" y1="138" x2="427" y2="150"/>
    <line x1="620" y1="138" x2="620" y2="150"/>
  </g>

  <!-- Day / date labels -->
  <g text-anchor="middle" dominant-baseline="central">
    <text x="40" y="166" font-size="14" font-weight="bold" fill="#2C2C2A">D0</text>
    <text x="40" y="184" font-size="12" fill="#5F5E5A">08/31</text>
    <text x="150" y="166" font-size="14" font-weight="bold" fill="#2C2C2A">D18</text>
    <text x="150" y="184" font-size="12" fill="#5F5E5A">09/18</text>
    <text x="235" y="166" font-size="14" font-weight="bold" fill="#2C2C2A">D25</text>
    <text x="235" y="184" font-size="12" fill="#5F5E5A">09/25</text>
    <text x="427" y="166" font-size="14" font-weight="bold" fill="#2C2C2A">D32</text>
    <text x="427" y="184" font-size="12" fill="#5F5E5A">10/02</text>
    <text x="620" y="166" font-size="14" font-weight="bold" fill="#2C2C2A">D39</text>
    <text x="620" y="184" font-size="12" fill="#5F5E5A">10/09</text>
  </g>

  <!-- Pre-swap phases (below axis) -->
  <rect x="40" y="200" width="110" height="26" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
  <text x="95" y="213" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">Differentiation</text>
  <rect x="150" y="200" width="85" height="26" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
  <text x="192" y="213" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">Maintenance</text>

  <!-- Assay days -->
  <line x1="427" y1="220" x2="427" y2="198" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="427" y="234" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">CARBONITE</text>
  <line x1="620" y1="220" x2="620" y2="198" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="234" text-anchor="end" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">CARBONITE</text>
  <text x="620" y="252" text-anchor="end" dominant-baseline="central" font-size="12" fill="#5F5E5A">+ imaging, both plates</text>
</svg>
